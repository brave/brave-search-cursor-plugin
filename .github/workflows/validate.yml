name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bash syntax check (install.sh)
        run: bash -n install.sh

      - name: Validate manifest + frontmatter
        run: node scripts/validate-template.mjs
